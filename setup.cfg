[bdist_rpm]
requires = python python-urllib3

[flake8]
ignore = E203, E266, E501, W503
max-line-length = 240

[tool:pytest]
junit_family = legacy
asyncio_mode = auto

[isort]
profile = black

[black]
max-line-length = 240
target-version = 'py38'

[mypy]
ignore_missing_imports = True

[metadata]
version = 3.2.0+lineaje.1
maintainer = Lineaje DepFixer
maintainer_email = 221268890+Lineaje-DepFixer@users.noreply.github.com
url = https://github.com/lineaje-labs-gos/opensearch-project-opensearch-py
